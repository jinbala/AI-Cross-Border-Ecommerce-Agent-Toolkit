<style>
:root{--ink:#182230;--muted:#667085;--line:#e4e7ec;--paper:#f4f6f9;--green:#2563eb;--accent:#eff4ff}
body[data-business=true] main>:not(#business-root){display:none!important}#business-root[hidden]{display:none!important}
main{max-width:1440px;margin:22px auto;padding:0 26px}h1{font-size:24px!important}header p{font-size:13px}button,a.button{font-size:13px;padding:8px 13px;border-radius:7px}button:hover{filter:brightness(.97)}.card,.product-card{border-radius:10px}.product-card h2{font-size:15px}.product-card .price{font-size:22px}#business-root{padding-bottom:30px}.biz-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.biz-head h1{margin:0}.biz-head p{font-size:13px;color:var(--muted);margin:5px 0 0}.biz-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.biz-panel{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;margin:16px 0}.biz-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.biz-form .wide{grid-column:1/-1}.biz-form input,.biz-form select,.biz-form textarea{margin-top:5px;font-size:14px;padding:9px 11px;box-sizing:border-box}.biz-form textarea{width:100%;font-family:inherit;min-height:90px;border:1px solid var(--line);border-radius:7px;resize:vertical}.biz-form label{font-size:12px}.biz-table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:9px}.biz-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}.biz-table th{background:#f8fafc;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}.biz-table td,.biz-table th{padding:13px 15px;border-bottom:1px solid var(--line);vertical-align:top}.biz-table tr:last-child td{border-bottom:0}.biz-table td:first-child{min-width:190px}.biz-table button{white-space:nowrap}.biz-tag{display:inline-block;padding:2px 7px;font-size:11px;background:var(--accent);color:var(--green);border-radius:5px}.biz-tag.demo{color:#9a5b00;background:#fff6dc}.biz-empty{text-align:center;color:var(--muted);padding:45px 20px}.biz-output{white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px;overflow:auto;font:13px/1.8 'Microsoft YaHei',sans-serif;background:#f8fafc;padding:18px;border-radius:7px}.biz-output:empty{display:none}.biz-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0}.biz-kpi{background:white;border:1px solid var(--line);border-radius:9px;padding:20px}.biz-kpi small{color:var(--muted);font-size:12px}.biz-kpi strong{display:block;font-size:25px;margin-top:8px}.biz-kpi.loss strong{color:#b42318}.biz-note{padding:12px 16px;background:var(--accent);color:#34517f;font-size:12px;border-radius:7px;white-space:pre-wrap}.biz-select{min-width:220px;max-width:420px}.biz-message{position:sticky;top:8px;z-index:5;padding:10px 16px;border-radius:7px;margin:10px 0;font-size:13px;background:#eaf6ee;color:#18794e}.biz-message.error{background:#fef3f2;color:#b42318}.biz-loading{color:var(--muted);padding:30px}.biz-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.biz-inline input{max-width:350px}.biz-form details{margin-top:0}.biz-form summary{padding:4px 0}.biz-section-actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:8px;background:#ffffffed;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:16px}.biz-select-note{font-size:12px;color:var(--muted)}@media(max-width:900px){.biz-kpis{grid-template-columns:1fr 1fr}.biz-form{grid-template-columns:1fr}.biz-head{align-items:flex-start}.biz-form .wide{grid-column:auto}main{padding:0 18px}.biz-panel{padding:17px}}
.factory-assessment{background:#eff4ff;border-radius:7px;padding:10px 12px;margin-top:12px;font-size:12px}.factory-assessment b{color:#2459ba}.factory-assessment p{margin:3px 0}.factory-assessment small{color:var(--muted)}#category-choices{max-height:240px;overflow:auto;padding:8px 0}#category-choices button{font-size:12px;padding:6px 9px}#custom-category-panel{background:#f8fafc;padding:10px 12px;border-radius:8px}
</style>
<section id="business-root" hidden aria-label="服装经营工作台"><div id="biz-message" role="status" hidden></div><div id="biz-content"></div></section>
